services:
  client:
    build:
      context: ./client
      args:
        VITE_APP_BASE_URL: ${VITE_APP_BASE_URL}
        VITE_APP_RAZORPAY_KEY: ${RAZORPAY_KEY_ID}
    ports:
      - "80:80"
    depends_on:
      - server
  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
