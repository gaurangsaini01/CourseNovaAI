name: CI / CD

on:
  push:
    branches:
      - main
env:
  REGISTRY: asia-south2-docker.pkg.dev/project-4d3d7acb-058d-4117-94f/coursenova

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push-to-gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Google Cloud (no password)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/273894459279/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@project-4d3d7acb-058d-4117-94f.iam.gserviceaccount.com
          token_format: access_token

      - name: Docker login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-south2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push client
        run: |
          docker build \
            --build-arg VITE_APP_BASE_URL=/api/v1 \
            --build-arg VITE_APP_RAZORPAY_KEY=${{ vars.RAZORPAY_KEY_ID }} \
            -t $REGISTRY/client:${{ github.sha }} \
            -t $REGISTRY/client:latest \
            ./client
          docker push --all-tags $REGISTRY/client

      - name: Build and push server
        run: |
          docker build \
            -t $REGISTRY/server:${{ github.sha }} \
            -t $REGISTRY/server:latest \
            ./server
          docker push --all-tags $REGISTRY/server
  deploy:
    needs: build-and-push-to-gcp
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ vars.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on VM
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            ${{ vars.VM_USER }}@${{ vars.VM_HOST }} '
              cd ~/CourseNovaAI &&
              git pull &&
              docker compose -f docker-compose.prod.yaml pull &&
              docker compose -f docker-compose.prod.yaml up -d
            '
